<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller IA — Grupo Horizonte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #ffffff; --surface: #f4f6fb; --fg: #1a2350; --muted: #5b6584;
    --accent: #f2660f; --accent-ink: #ffffff; --blue: #1e3aa8; --line: #e2e6f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
    padding: 32px 20px 48px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  .eyebrow {
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--blue); font-weight: 700; margin: 0 0 6px;
  }
  h1 {
    font-family: "Poppins", "Inter", sans-serif; font-weight: 700;
    font-size: clamp(22px, 6vw, 28px); line-height: 1.15; margin: 0 0 28px;
  }
  a.card {
    display: block; background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px; margin-bottom: 14px;
    text-decoration: none; color: var(--fg);
  }
  a.card .name { font-weight: 700; font-size: 16px; display: block; margin-bottom: 4px; }
  a.card .desc { font-size: 13px; color: var(--muted); }
  footer { margin-top: 24px; font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Grupo Horizonte Educa Perú &middot; 30/09/2026</p>
  <h1>Taller de IA aplicada a la educación</h1>

  <a class="card" href="prompts.html">
    <span class="name">Prompts del taller</span>
    <span class="desc">Ejemplos completos (Panadería y Soporte Técnico) con botón de copiar</span>
  </a>

  <a class="card" href="enlaces.html">
    <span class="name">Enlaces del taller</span>
    <span class="desc">Accesos directos a ChatGPT y NotebookLM</span>
  </a>

  <footer>CETPRO UGEL 01 &middot; San Juan de Miraflores</footer>
</div>
</body>
</html>
